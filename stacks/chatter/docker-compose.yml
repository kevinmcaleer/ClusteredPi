# Chatter — comment/auth service for kevsrobots.com (and accounts.kevsrobots.com)
# Deploy or update on any node, from this folder:
#   1. First time only: copy .env.example to .env and fill in values (CHATTER_TUNNEL_TOKEN, DATABASE_URL, SECRET_KEY)
#   2. docker compose pull && docker compose up -d
# `pull` fetches the latest Chatter image from the local registry (and cloudflared); `up -d` only restarts what changed.
# If the registry is down, `up -d` still starts from the image already on the node.
# Never add --remove-orphans: the Chatter source folder is also Compose project "chatter".

services:
  chatter:
    # Override with CHATTER_IMAGE in .env to try another tag.
    image: ${CHATTER_IMAGE:-192.168.2.1:5000/kevsrobots/chatter:latest}
    restart: unless-stopped
    environment:
      - SECRET_KEY=${SECRET_KEY:-changeme}
      - PORT=8006
      # Production sets the login cookie on .kevsrobots.com (Secure), so other kevsrobots sites such as
      # bettercad.kevsrobots.com see you signed in. Without it the cookie stays on chatter.kevsrobots.com.
      - ENVIRONMENT=production
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8006/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    # ``--edge-ip-version 4`` forces the QUIC socket to IPv4 only.
    # Without it, cloudflared binds a dual-stack [::] socket; if the
    # host has IPv6 partly enabled but no working IPv6 default route
    # (common after a Pi power-cut / DHCP-renew glitch) every send
    # fails with "sendmsg: network is unreachable" and the tunnel
    # never connects. IPv4-only is the surgical fix and stays
    # working regardless of how the host's IPv6 looks.
    command: tunnel --no-autoupdate --edge-ip-version 4 run
    environment:
      # The chatter .env names it CHATTER_TUNNEL_TOKEN; plain TUNNEL_TOKEN still works.
      - TUNNEL_TOKEN=${CHATTER_TUNNEL_TOKEN:-${TUNNEL_TOKEN:?set CHATTER_TUNNEL_TOKEN in .env}}
    restart: unless-stopped
    depends_on:
      chatter:
        condition: service_healthy
    network_mode: "service:chatter"
