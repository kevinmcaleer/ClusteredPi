# Storybook — component library docs
# Deploy on any node:
#   1. Build and push:
#      docker build -t 192.168.2.1:5000/storybook:latest .
#      docker push 192.168.2.1:5000/storybook:latest
#   2. Copy .env.example to .env and set TUNNEL_TOKEN
#   3. docker compose -f docker-compose.prod.yml up -d

services:
  storybook:
    image: 192.168.2.1:5000/storybook:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:6006/"]
      interval: 30s
      timeout: 10s
      start_period: 10s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --edge-ip-version 4 run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      storybook:
        condition: service_healthy
    network_mode: "service:storybook"
