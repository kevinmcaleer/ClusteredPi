# kevsrobots.com website: nginx serving the Jekyll build, with a
# Cloudflare Tunnel sidecar.
#
# Build node (rebuild from kevsrobots.com main, then publish):
#   docker compose up -d --build
#   docker compose push kevsrobots
#
# Other nodes (dev02, dev03, dev04):
#   1. Copy .env.example to .env and set TUNNEL_TOKEN and NODE_NAME
#   2. docker compose pull && docker compose up -d
#
# Each node registers as a connector for the same tunnel.
# Cloudflare load-balances across all active connectors.
# If a node goes down, traffic routes to the others automatically.
#
# The dockerfile re-clones kevsrobots.com whenever main has new commits,
# so a plain --build picks up the latest site without --no-cache.

services:
  kevsrobots:
    build:
      context: .
      dockerfile: dockerfile
    image: 192.168.2.1:5000/kevsrobots:latest
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3333/health"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3

  cloudflared:
    image: cloudflare/cloudflared:latest
    command: tunnel --no-autoupdate --edge-ip-version 4 --label hostname=${NODE_NAME:-unknown} run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      kevsrobots:
        condition: service_healthy
    network_mode: "service:kevsrobots"
